name: release

# On a v* tag, build each platform's binary and attach it to the release, where the plugin's
# installers (install.sh, install.ps1) download it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Sigstore-signed build provenance for every release asset, verifiable by anyone via
  # `gh attestation verify <asset> --repo persiyanov/herdr-reviewr`.
  id-token: write
  attestations: write

jobs:
  # A tag push creates no Release object on its own, and the upload action below uploads to an
  # existing release — so create it first (idempotent), and have the matrix depend on it.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The body is the tag's CHANGELOG section, and a missing one fails the release. A draft, since
      # an immutable release refuses assets once published.
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          title: herdr-reviewr $version
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v7

      # Build, archive as herdr-reviewr-<target>.tar.gz (.zip on Windows) with a .sha256 sidecar,
      # and upload: the installers download exactly these names.
      - uses: taiki-e/upload-rust-binary-action@v1
        id: upload
        with:
          bin: herdr-reviewr
          target: ${{ matrix.target }}
          archive: $bin-$target
          tar: unix
          zip: windows
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

      # The archive the step above built and uploaded gets a signed provenance attestation. The
      # step names the one archive it built for this platform, .zip or .tar.gz.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.upload.outputs.zip || steps.upload.outputs.tar }}

  # Publish last, once every asset is attached: a failed target leaves a draft, never a release
  # that installs 404.
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
